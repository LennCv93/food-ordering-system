apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: food-ordering
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: user-service
        metrics_path: /actuator/prometheus
        scrape_interval: 15s
        static_configs:
          - targets: ["user-service:8081"]

      - job_name: catalog-service
        metrics_path: /actuator/prometheus
        scrape_interval: 15s
        static_configs:
          - targets: ["catalog-service:8082"]

      - job_name: order-service
        metrics_path: /actuator/prometheus
        scrape_interval: 15s
        static_configs:
          - targets: ["order-service:8083"]

      - job_name: payment-service
        metrics_path: /actuator/prometheus
        scrape_interval: 15s
        static_configs:
          - targets: ["payment-service:8084"]

      - job_name: delivery-service
        metrics_path: /actuator/prometheus
        scrape_interval: 15s
        static_configs:
          - targets: ["delivery-service:8085"]
